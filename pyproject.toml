[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-ai"
version = "0.1.0"
description = "Office AI Test Environment — Phase 1 (FastAPI + Ollama)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118.0",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.11",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.4.0",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  # Phase 2A file pipeline
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "anyio>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
