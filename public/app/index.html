<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexus.ai — AI Assistant for Office Documents &amp; Data</title>
    <meta
      name="description"
      content="Nexus.ai helps office teams summarize files, draft Word documents, build Excel sheets and query the office database from one AI chat workspace."
    />
    <meta property="og:title" content="Nexus.ai — AI Assistant for Office Documents & Data" />
    <meta
      property="og:description"
      content="Summarize files, draft Word documents, build Excel sheets and query the office database from one AI chat workspace."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="../favicon.ico"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="auth-overlay" id="auth-overlay" hidden>
      <div class="auth-card">
        <div class="brand" style="margin-bottom: 16px">
          <div class="brand-mark"></div>
          <span class="brand-name">Nexus.ai</span>
        </div>
        <h2>Sign in</h2>
        <form id="auth-form">
          <label>Username <input id="auth-username" autocomplete="username" required /></label>
          <label>Password <input id="auth-password" type="password" autocomplete="current-password" required /></label>
          <button type="submit" class="btn-primary" id="auth-submit">Continue</button>
          <p class="auth-error" id="auth-error" hidden></p>
        </form>
        <div class="auth-divider">or</div>
        <form id="register-form">
          <h3 style="font-size: 13px; margin: 0 0 8px">Create account</h3>
          <label>Username <input id="reg-username" required /></label>
          <label>Password <input id="reg-password" type="password" required /></label>
          <label>Display name <input id="reg-display" placeholder="Optional" /></label>
          <button type="submit" class="btn-ghost" style="width: 100%">Register</button>
          <p class="auth-error" id="reg-error" hidden></p>
        </form>
      </div>
    </div>

    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand">
            <div class="brand-mark"></div>
            <span class="brand-name">Nexus.ai</span>
          </div>

          <button class="btn-primary" id="new-conversation">New Document</button>

          <nav>
            <h3 class="rail-label">Recent Context</h3>
            <ul class="conv-list" id="conversation-list"></ul>

            <h3 class="rail-label">Inference Nodes</h3>
            <div class="systems" id="node-status">
              <div class="system" data-node="node1"><span class="dot" id="dot-node1"></span><span id="label-node1">Node 1 — loading…</span></div>
              <div class="system" data-node="node2"><span class="dot" id="dot-node2"></span><span id="label-node2">Node 2 — loading…</span></div>
            </div>
            <h3 class="rail-label" style="margin-top:24px; display:flex; align-items:center; justify-content:space-between;">Storage <button type="button" id="storage-refresh" class="btn-ghost" style="padding:2px 6px; font-size:10px;">↻</button></h3>
            <div class="storage" id="storage">
              <div class="storage-meta" id="storage-meta" style="font-size:11px; color: rgb(26 26 27 / 0.5); margin-bottom:8px;">—</div>
              <ul class="storage-list" id="storage-list" style="list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;"></ul>
              <div class="storage-empty" id="storage-empty" style="display:none; font-size:11px; color: rgb(26 26 27 / 0.4); padding:8px 0;">No files yet — attach via 📎</div>
            </div>
            <a href="/docs" target="_blank" class="tool" style="margin-top: 12px; display: inline-flex">API Docs →</a>
          </nav>
        </div>

        <div class="sidebar-foot">
          <div class="avatar" id="avatar">?</div>
          <div>
            <p class="user-name" id="user-name">—</p>
            <p class="user-role" id="user-role">Local test</p>
          </div>
          <button class="btn-ghost" id="logout" style="margin-left: auto; padding: 4px 8px; font-size: 11px">Logout</button>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <span class="crumb">Project</span>
            <span class="project-title" id="project-title">Q3 Revenue Analysis</span>
          </div>
          <div class="topbar-actions">
            <label class="node-select-label">Model:
              <select id="node-select" class="node-select">
                <option value="">Auto (router)</option>
                <option value="node1">Node 1</option>
                <option value="node2">Node 2</option>
              </select>
            </label>
            <button class="btn-ghost" id="node-health-btn" title="Refresh node health">↻ Nodes</button>
          </div>
        </header>

        <div class="workspace">
          <!-- Chat stream -->
          <section class="chat">
            <div class="stream" id="stream"></div>

            <div class="composer">
              <div class="attachments" id="attachments"></div>
              <div class="composer-shell">
                <textarea
                  id="composer-input"
                  placeholder="Ask Nexus to write, calculate, or query..."
                ></textarea>
                <button class="send" id="send" aria-label="Send message">→</button>
              </div>
              <div class="composer-tools">
                <label class="tool" style="cursor: pointer"><input type="checkbox" id="stream-toggle" /> Stream</label>
                <button type="button" class="btn-ghost" id="attach-btn" title="Attach file (.txt, .md, .csv, .xlsx, .docx, .pdf)" style="padding:6px 10px; font-size:12px; display:inline-flex; align-items:center; gap:6px;">📎 Attach file</button>
                <input type="file" id="file-input" hidden accept=".txt,.md,.csv,.xlsx,.docx,.pdf" multiple />
                <span class="tool" id="latency-hint"></span>
                <span class="tool" id="file-hint" style="display:none"></span>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
